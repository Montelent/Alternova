# Include these locations inside the application's Nginx server {} block.
# Keep the executable-extension deny rule BEFORE the generic PHP fastcgi location.

# Never serve dotfiles or executable/script payloads from user-controlled media.
location ~* ^/(?:uploads|storage)/(?:.*/)?\. {
    deny all;
    return 404;
}

location ~* ^/(?:uploads|storage)/.*\.(?:php[0-9]?|phtml|phar|cgi|fcgi|pl|py|sh|asp|aspx|jsp|shtml)(?:/|$) {
    deny all;
    return 404;
}

# SVG is not accepted by the upload forms. Keep a restrictive policy for
# legacy SVG files that may already exist in either public media directory.
location ~* ^/(?:uploads|storage)/.*\.svg$ {
    autoindex off;
    try_files $uri =404;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
}

location /uploads/ {
    autoindex off;
    try_files $uri =404;
    add_header X-Content-Type-Options "nosniff" always;
}

location /storage/ {
    autoindex off;
    try_files $uri =404;
    add_header X-Content-Type-Options "nosniff" always;
}
