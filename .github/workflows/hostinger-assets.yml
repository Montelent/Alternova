name: Hostinger frontend assets

on:
  pull_request:
    paths:
      - 'resources/css/**'
      - 'resources/js/**'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/hostinger-assets.yml'
  push:
    branches:
      - main
    paths:
      - 'resources/css/**'
      - 'resources/js/**'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/hostinger-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-frontend-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package Laravel Vite assets
    runs-on: ubuntu-latest
    env:
      HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
      HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
      HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
      HOSTINGER_PUBLIC_DIR: ${{ secrets.HOSTINGER_PUBLIC_DIR }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit

      - name: Run frontend behavior tests
        run: npm run test:js

      - name: Remove any development-server marker
        run: rm -f public/hot

      - name: Build production assets
        run: npm run build

      - name: Verify Laravel Vite manifest and referenced files
        shell: bash
        run: |
          set -euo pipefail
          test -s public/build/manifest.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('public/build/manifest.json', 'utf8'));
          const entries = Object.values(manifest);
          if (!entries.length) throw new Error('Vite manifest is empty');
          for (const entry of entries) {
            for (const file of [entry.file, ...(entry.css ?? []), ...(entry.assets ?? [])]) {
              if (file && !fs.existsSync(`public/build/${file}`)) {
                throw new Error(`Missing Vite build output: ${file}`);
              }
            }
          }
          console.log(`Verified ${entries.length} Vite manifest entries.`);
          NODE
          test ! -e public/hot

      - name: Package public/build for Hostinger
        uses: actions/upload-artifact@v4
        with:
          name: alternova-hostinger-public-build
          path: public/build/
          if-no-files-found: error
          retention-days: 14

      - name: Deploy compiled assets to Hostinger over explicit FTPS
        if: ${{ github.event_name == 'push' && env.HOSTINGER_FTP_SERVER != '' && env.HOSTINGER_FTP_USERNAME != '' && env.HOSTINGER_FTP_PASSWORD != '' && env.HOSTINGER_PUBLIC_DIR != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: public/build/
          server-dir: ${{ secrets.HOSTINGER_PUBLIC_DIR }}/build/
          dangerous-clean-slate: false

      - name: Remove stale Laravel Vite hot-file from Hostinger
        if: ${{ github.event_name == 'push' && env.HOSTINGER_FTP_SERVER != '' && env.HOSTINGER_FTP_USERNAME != '' && env.HOSTINGER_FTP_PASSWORD != '' && env.HOSTINGER_PUBLIC_DIR != '' }}
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          PUBLIC_DIR: ${{ secrets.HOSTINGER_PUBLIC_DIR }}
        run: |
          python3 <<'PY'
          import ftplib
          import os

          ftp = ftplib.FTP_TLS(timeout=30)
          ftp.connect(os.environ["FTP_SERVER"], 21)
          ftp.auth()
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
          ftp.prot_p()
          ftp.cwd(os.environ["PUBLIC_DIR"])
          try:
              ftp.delete("hot")
              print("Removed stale public/hot file.")
          except ftplib.error_perm as error:
              if not str(error).startswith("550"):
                  raise
              print("No stale public/hot file was present.")
          finally:
              try:
                  ftp.quit()
              except Exception:
                  ftp.close()
          PY
