name: Hostinger frontend assets

on:
  pull_request:
    paths:
      - 'resources/css/**'
      - 'resources/js/**'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/hostinger-assets.yml'
  push:
    branches:
      - main
    paths:
      - 'resources/css/**'
      - 'resources/js/**'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/hostinger-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-frontend-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and commit Laravel Vite assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit

      - name: Run frontend behavior tests
        run: npm run test:js

      - name: Remove any development-server marker
        run: rm -f public/hot

      - name: Build production assets
        run: npm run build

      - name: Verify Laravel Vite manifest and referenced files
        shell: bash
        run: |
          set -euo pipefail
          test -s public/build/manifest.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('public/build/manifest.json', 'utf8'));
          const entries = Object.values(manifest);
          if (!entries.length) throw new Error('Vite manifest is empty');
          for (const entry of entries) {
            for (const file of [entry.file, ...(entry.css ?? []), ...(entry.assets ?? [])]) {
              if (file && !fs.existsSync(`public/build/${file}`)) {
                throw new Error(`Missing Vite build output: ${file}`);
              }
            }
          }
          console.log(`Verified ${entries.length} Vite manifest entries.`);
          NODE
          test ! -e public/hot

      - name: Commit compiled assets to main for git-pull deployment
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/build
          if git diff --cached --quiet; then
            echo "Compiled assets are already up to date."
            exit 0
          fi
          git commit -m "Build production frontend assets [skip ci]"
          git push origin HEAD:main

      - name: Package public/build for optional manual recovery
        uses: actions/upload-artifact@v7
        with:
          name: alternova-hostinger-public-build
          path: public/build/
          if-no-files-found: error
          retention-days: 14
