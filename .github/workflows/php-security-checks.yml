name: PHP security checks

on:
  pull_request:
  push:
    branches:
      - main
      - security/production-hardening-2026-11

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax and Composer manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint application PHP files
        run: |
          find app bootstrap config database routes -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

  dependency-audit:
    name: Dependency audit and frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Audit Composer dependencies
        run: composer audit --locked

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

      - name: Install npm dependencies
        run: npm ci --no-audit

      - name: Build production frontend assets
        run: npm run build

  unit-tests:
    name: Security helper unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, curl, fileinfo, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-plugins --prefer-dist --no-progress --no-interaction

      - name: Run security helper unit tests
        run: vendor/bin/phpunit tests/Unit
