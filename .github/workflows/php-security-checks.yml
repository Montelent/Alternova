name: PHP security checks

on:
  pull_request:
  push:
    branches:
      - main
      - security/production-hardening-2026-11

permissions:
  contents: write

jobs:
  php-lint:
    name: PHP syntax and Composer manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint application PHP files
        run: |
          find app bootstrap config database routes -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate Composer manifest
        run: composer validate --no-check-publish --no-check-lock

  dependency-audit:
    name: Dependency audit and frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Resolve Composer dependencies for audit
        run: composer update --no-install --no-scripts --no-plugins --prefer-dist

      - name: Audit Composer dependencies
        run: composer audit --locked

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Generate temporary npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

      - name: Install npm dependencies
        run: npm ci --no-audit

      - name: Build production frontend assets
        run: npm run build

      - name: Commit resolved lockfiles to the security branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/security/production-hardening-2026-11'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = 'security/production-hardening-2026-11';
            for (const path of ['composer.lock', 'package-lock.json']) {
              const content = fs.readFileSync(path);
              let sha;
              try {
                const existing = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path,
                  ref: branch,
                });
                if (existing.data.type === 'file') {
                  const previous = Buffer.from(existing.data.content, 'base64');
                  if (previous.equals(content)) continue;
                  sha = existing.data.sha;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                message: 'chore: pin Composer and npm dependencies',
                content: content.toString('base64'),
                branch,
                ...(sha ? { sha } : {}),
              });
            }


  unit-tests:
    name: Security helper unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, curl, fileinfo, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-plugins --prefer-dist --no-progress --no-interaction

      - name: Run security helper unit tests
        run: vendor/bin/phpunit tests/Unit
