name: PHP security checks

on:
  pull_request:
  push:
    branches:
      - main
      - security/production-hardening-2026-11

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax and Composer manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint application PHP files
        run: |
          find app bootstrap config database routes -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate Composer manifest
        run: composer validate --no-check-publish --no-check-lock
